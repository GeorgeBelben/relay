name: Build relay-core

on:
  push:
    branches: [main]
    paths:
      - "relay-core/**"
      - "relay-cli/**"
      - "relay-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build relay-core
        run: cargo build --release -p relay-core

      - name: Build relay-cli
        run: cargo build --release -p relay-cli

      - uses: actions/upload-artifact@v4
        with:
          name: relay-core-binary
          path: target/release/relay-core
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: relay-cli-binary
          path: target/release/relay-cli
          retention-days: 14
