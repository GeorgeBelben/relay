name: Build relay-core

on:
  push:
    branches: [main]
    paths:
      - "relay-core/**"
      - "relay-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build relay-core
        run: cargo build --release -p relay-core

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-core-binary
          path: target/release/relay-core
          retention-days: 14
