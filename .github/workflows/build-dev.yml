name: Build Dev

# Manually-triggered build for on-device testing. Produces a .deb artifact without
# cutting a version tag / GitHub Release (see release.yml for that flow).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          # createUpdaterArtifacts (tauri.conf.json) makes every build -- not just tagged
          # releases -- require signing once a pubkey is configured (see REL-127). Without these,
          # tauri build fails with "public key found, but no private key".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            packaging/systemd/relay.service
            packaging/cursor-theme/relay-blank/**
          retention-days: 7
